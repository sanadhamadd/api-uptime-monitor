spring.application.name=api-uptime-monitor
server.port=8080

# Database: in-memory H2, recreated on every start
spring.jpa.open-in-view=false

# Checks may only call public addresses on ports 80 and 443. The "dev" profile,
# which ./mvnw spring-boot:run uses, turns this on so the demo can check localhost.
uptime.allow-private-targets=false

# When set, every /api request must send this value in the X-API-Key header.
# Set it outside this file, for example with the UPTIME_API_KEY environment variable.
uptime.api-key=

# Limits for one check: connecting, each read, the whole call, and the body size
uptime.connect-timeout=5s
uptime.read-timeout=5s
uptime.request-deadline=10s
uptime.max-body-size=1MB
