spring.application.name=api-uptime-monitor
server.port=8080

# Database: in-memory H2, recreated on every start
spring.jpa.open-in-view=false

# Outgoing HTTP calls: give up after 5 seconds instead of waiting forever
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=5s
